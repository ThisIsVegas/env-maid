name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true

      - name: Restore
        run: dotnet restore EnvMaid.slnx

      - name: Build
        run: dotnet build EnvMaid.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/EnvMaid.App.Tests/EnvMaid.App.Tests.csproj --no-build --configuration Release

      - name: Publish
        run: >
          dotnet publish src/EnvMaid.App -r win-x64 --self-contained
          -p:PublishSingleFile=true -c Release -o publish

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/EnvMaid.exe
